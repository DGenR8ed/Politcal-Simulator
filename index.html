<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Political Simulator</title>
    <style>
        body {{
            background: url('background.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: #f0f0f0;
        }}
        .overlay {{
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.6);
            z-index: -1;
        }}
        #game, #setup {{
            max-width: 800px;
            margin: auto;
            background: rgba(0,0,0,0.6);
            padding: 20px;
            border-radius: 10px;
        }}
        button {{
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            font-size: 16px;
            background-color: #333;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }}
        button:hover {{
            background-color: #555;
        }}
        #stats {{
            margin-bottom: 20px;
        }}
    </style>
</head>
<body>
<div class="overlay"></div>
<div id="setup">
    <h2>Enter Your Name to Begin</h2>
    <input type="text" id="playerName" placeholder="Your name here" style="padding:10px;width:100%;font-size:16px;">
    <button onclick="startGame()">Start Game</button>
    <hr>
</div>
<div id="game" class="hidden">
    <div id="stats"></div>
    <h1>Political Simulator</h1>
    <div id="yearHeader"></div>
    <div id="story"></div>
    <div id="choices"></div>
</div>

<script>
    let gameState = {{
        playerName: '',
        phase: "2025a",
        publicSupport: 60,
        reputation: 50,
        environment: 50,
        scandalRisk: 10,
        parliament: 60
    }};

    const scenarios = {{
        "2025a": {{
            year: "2025",
            text: "Prime Minister ${{gameState.playerName}}, you take office in a divided nation. What is your first action?",
            choices: [
                {{ text: "A) Launch national unity reform agenda", next: "2025b", effect: () => gameState.reputation += 5 }},
                {{ text: "B) Focus on inflation, cut taxes", next: "2025b", effect: () => gameState.publicSupport += 5 }},
                {{ text: "C) Ban foreign tech firms over AI concerns", next: "2025b", effect: () => gameState.scandalRisk += 10 }}
            ]
        }},
        "2025b": {{
            year: "2025",
            text: "Indigenous leaders call for constitutional talks. What do you do?",
            choices: [
                {{ text: "A) Begin full negotiation and offer land restitution", next: "2026a", effect: () => gameState.reputation += 7 }},
                {{ text: "B) Invite talks, but delay decisions", next: "2026a", effect: () => gameState.reputation += 2 }},
                {{ text: "C) Reject talks as 'not urgent'", next: "2026a", effect: () => gameState.publicSupport -= 5 }}
            ]
        }},
        "2026a": {{
            year: "2026",
            text: "A natural disaster hits B.C. due to record heatwaves. How do you respond?",
            choices: [
                {{ text: "A) Deploy military & fund recovery", next: "2026b", effect: () => {{ gameState.environment += 5; gameState.publicSupport += 5; }} }},
                {{ text: "B) Blame provinces and delay", next: "2026b", effect: () => gameState.publicSupport -= 10 }},
                {{ text: "C) Offer tax relief only", next: "2026b", effect: () => gameState.parliament -= 5 }}
            ]
        }},
        "2026b": {{
            year: "2026",
            text: "Tech companies want to pilot AI surveillance in Toronto. Do you allow it?",
            choices: [
                {{ text: "A) Yes, with federal oversight", next: "2027a", effect: () => gameState.scandalRisk += 10 }},
                {{ text: "B) No, protect citizen privacy", next: "2027a", effect: () => gameState.reputation += 5 }},
                {{ text: "C) Yes, no restrictions", next: "2027a", effect: () => gameState.publicSupport += 5 }}
            ]
        }},
        "2027a": {{
            year: "2027",
            text: "You propose a national referendum. What is the focus?",
            choices: [
                {{ text: "A) Climate and energy modernization", next: "2027b", effect: () => gameState.environment += 7 }},
                {{ text: "B) Senate reform and term limits", next: "2027b", effect: () => gameState.reputation += 5 }},
                {{ text: "C) AI regulation and civil liberties", next: "2027b", effect: () => gameState.reputation += 3 }}
            ]
        }},
        "2027b": {{
            year: "2027",
            text: "Public reaction to the referendum is mixed. How do you respond?",
            choices: [
                {{ text: "A) Double down and declare a national mandate", next: "2028a", effect: () => gameState.publicSupport += 3 }},
                {{ text: "B) Scale back and rewrite legislation", next: "2028a", effect: () => gameState.reputation += 2 }},
                {{ text: "C) Delay action until after next election", next: "2028a", effect: () => gameState.parliament -= 5 }}
            ]
        }},
        "2028a": {{
            year: "2028",
            text: "It's an election year. What is your re-election strategy?",
            choices: [
                {{ text: "A) Highlight your climate leadership", next: "end", effect: () => gameState.environment += 5 }},
                {{ text: "B) Emphasize economic recovery", next: "end", effect: () => gameState.publicSupport += 5 }},
                {{ text: "C) Run on national security and AI control", next: "end", effect: () => gameState.reputation += 5 }}
            ]
        }},
        "end": {{
            year: "2028",
            text: () => {{
                const avg = (gameState.publicSupport + gameState.reputation + gameState.environment) / 3;
                if (avg > 70) return "You are re-elected in a landslide and become a global figure. Your first 4 years were transformative.";
                if (avg > 60) return "You win re-election and maintain a strong coalition. Your policies earned cautious respect.";
                return "You survive politically, but your mandate is shaky. Many wonder if you're fit for the next term.";
            }},
            choices: []
        }}
    }};

    function startGame() {{
        const name = document.getElementById("playerName").value.trim();
        if (!name) return alert("Enter your name.");
        gameState.playerName = name;
        localStorage.setItem("gameState", JSON.stringify(gameState));
        document.getElementById("setup").classList.add("hidden");
        document.getElementById("game").classList.remove("hidden");
        render();
    }}

    function render() {{
        const state = scenarios[gameState.phase];
        document.getElementById("stats").innerHTML = `
            <strong>Public Support:</strong> ${gameState.publicSupport} |
            <strong>Reputation:</strong> ${gameState.reputation} |
            <strong>Environment:</strong> ${gameState.environment} |
            <strong>Scandal Risk:</strong> ${gameState.scandalRisk} |
            <strong>Parliament Seats:</strong> ${gameState.parliament}
        `;
        document.getElementById("yearHeader").innerText = "Year: " + state.year;
        const story = typeof state.text === "function" ? state.text() : state.text.replace("${gameState.playerName}", gameState.playerName);
        document.getElementById("story").innerHTML = story;

        const choicesDiv = document.getElementById("choices");
        choicesDiv.innerHTML = "";

        state.choices.forEach(choice => {{
            const btn = document.createElement("button");
            btn.textContent = choice.text;
            btn.onclick = () => {{
                choice.effect();
                gameState.phase = choice.next;
                localStorage.setItem("gameState", JSON.stringify(gameState));
                render();
            }};
            choicesDiv.appendChild(btn);
        }});
    }}

    window.onload = () => {{
        const saved = localStorage.getItem("gameState");
        if (saved) {{
            Object.assign(gameState, JSON.parse(saved));
            document.getElementById("setup").classList.add("hidden");
            document.getElementById("game").classList.remove("hidden");
            render();
        }}
    }};
</script>
</body>
</html>
